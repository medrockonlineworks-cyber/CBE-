name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Debug Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Java JDK 21 (required by Capacitor 8 JavaVersion.VERSION_21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify preinstalled Android SDK
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          ls -la "$SDK_DIR/platforms" || true

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies from package-lock.json
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Prepare dist assets for Capacitor
        run: |
          rm -rf dist/assets/aistudio
          rm -f dist/downloads/*.apk

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK output
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cbe-mobile-banking-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK to GitHub Release (no ZIP required)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk CBE-Mobile-Banking-debug.apk
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk CBE-Mobile-Banking-debug.apk --clobber
          else
            gh release create latest-apk CBE-Mobile-Banking-debug.apk \
              --title "CBE Mobile Banking Debug APK" \
              --notes "Latest installable debug APK (direct .apk download, no ZIP extraction needed)."
          fi
