name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Debug Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Java JDK 21 (required by Capacitor 8 JavaVersion.VERSION_21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify preinstalled Android SDK
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          ls -la "$SDK_DIR/platforms" || true

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies from package-lock.json
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Prepare dist assets for Capacitor
        run: |
          rm -rf dist/assets/aistudio
          rm -f dist/downloads/*.apk

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Verify permanent signing keystore
        run: |
          test -f android/app/debug.keystore
          keytool -list -keystore android/app/debug.keystore -storetype PKCS12 -storepass android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build CBE Mobile, Messages, Truecaller & Phone Debug APKs
        working-directory: android
        run: |
          APP_VERSION_CODE=$((100 + ${{ github.run_number }}))
          APP_VERSION_NAME="1.0.${{ github.run_number }}"
          echo "Building APKs with versionCode=$APP_VERSION_CODE versionName=$APP_VERSION_NAME"
          ./gradlew assembleCbeDebug assembleMessagesDebug assembleTruecallerDebug assemblePhoneDebug \
            -PappVersionCode="$APP_VERSION_CODE" \
            -PappVersionName="$APP_VERSION_NAME" \
            --no-daemon

      - name: Verify APK outputs
        run: |
          CBE_APK="android/app/build/outputs/apk/cbe/debug/app-cbe-debug.apk"
          MSG_APK="android/app/build/outputs/apk/messages/debug/app-messages-debug.apk"
          TC_APK="android/app/build/outputs/apk/truecaller/debug/app-truecaller-debug.apk"
          PHONE_APK="android/app/build/outputs/apk/phone/debug/app-phone-debug.apk"
          test -f "$CBE_APK"
          test -f "$MSG_APK"
          test -f "$TC_APK"
          test -f "$PHONE_APK"
          ls -lh "$CBE_APK" "$MSG_APK" "$TC_APK" "$PHONE_APK"
          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            echo "=== Verifying Permanent Signing Certificate ==="
            for apk in "$CBE_APK" "$MSG_APK" "$TC_APK" "$PHONE_APK"; do
              "$APKSIGNER" verify --print-certs "$apk" | grep -E "Signer #1 certificate (DN|SHA-256)"
            done
          fi
          AAPT2=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name aapt2 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$AAPT2" ]; then
            echo "=== Messages APK Badging ==="
            BADGING=$("$AAPT2" dump badging "$MSG_APK")
            echo "$BADGING" | grep -E "package:|application-label|application-icon|launchable-activity"
            echo "$BADGING" | grep -q "name='et.cbe.messages'"
            echo "$BADGING" | grep -q "application-label:'Messages'"
            (echo "$BADGING" | grep -q "ic_messages_launcher" || unzip -l "$MSG_APK" | grep -q "ic_messages_launcher")

            echo "=== Truecaller APK Badging ==="
            TC_BADGING=$("$AAPT2" dump badging "$TC_APK")
            echo "$TC_BADGING" | grep -E "package:|application-label|application-icon|launchable-activity"
            echo "$TC_BADGING" | grep -q "name='et.cbe.truecaller'"
            echo "$TC_BADGING" | grep -q "application-label:'Truecaller'"
            (echo "$TC_BADGING" | grep -q "ic_truecaller_launcher" || unzip -l "$TC_APK" | grep -q "ic_truecaller_launcher")

            echo "=== Phone APK Badging ==="
            PHONE_BADGING=$("$AAPT2" dump badging "$PHONE_APK")
            echo "$PHONE_BADGING" | grep -E "package:|application-label|application-icon|launchable-activity"
            echo "$PHONE_BADGING" | grep -q "name='et.cbe.phone'"
            echo "$PHONE_BADGING" | grep -q "application-label:'Phone'"
            (echo "$PHONE_BADGING" | grep -q "ic_phone_launcher" || unzip -l "$PHONE_APK" | grep -q "ic_phone_launcher")
          fi

      - name: Upload CBE Mobile Banking APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cbe-mobile-banking-debug-apk
          path: android/app/build/outputs/apk/cbe/debug/app-cbe-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Standalone Messages SMS APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: messages-sms-debug-apk
          path: android/app/build/outputs/apk/messages/debug/app-messages-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Standalone Truecaller APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: truecaller-debug-apk
          path: android/app/build/outputs/apk/truecaller/debug/app-truecaller-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Standalone Phone APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: phone-debug-apk
          path: android/app/build/outputs/apk/phone/debug/app-phone-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APKs to GitHub Release (no ZIP required)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/cbe/debug/app-cbe-debug.apk CBE-Mobile-Banking-debug.apk
          cp android/app/build/outputs/apk/messages/debug/app-messages-debug.apk Messages-SMS-debug.apk
          cp android/app/build/outputs/apk/truecaller/debug/app-truecaller-debug.apk Truecaller-debug.apk
          cp android/app/build/outputs/apk/phone/debug/app-phone-debug.apk Phone-debug.apk
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk CBE-Mobile-Banking-debug.apk Messages-SMS-debug.apk Truecaller-debug.apk Phone-debug.apk --clobber
          else
            gh release create latest-apk CBE-Mobile-Banking-debug.apk Messages-SMS-debug.apk Truecaller-debug.apk Phone-debug.apk \
              --title "CBE Mobile Banking & Standalone Sub-App APKs" \
              --notes "Direct installable Android APKs: CBE-Mobile-Banking-debug.apk (CBE Mobile), Messages-SMS-debug.apk (Messages), Truecaller-debug.apk (Truecaller), and Phone-debug.apk (Phone)."
          fi
