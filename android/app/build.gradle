apply plugin: 'com.android.application'

def ciVersionCode = (project.hasProperty('appVersionCode') ? project.property('appVersionCode') : (System.getenv('APP_VERSION_CODE') ?: '100')).toString().toInteger()
def ciVersionName = (project.hasProperty('appVersionName') ? project.property('appVersionName') : (System.getenv('APP_VERSION_NAME') ?: "1.0.${ciVersionCode}")).toString()
def rawGithubRepo = (project.hasProperty('githubRepo') ? project.property('githubRepo') : (System.getenv('GITHUB_REPOSITORY') ?: '')).toString().trim()
def ciGithubRepo = rawGithubRepo.replaceAll('[^A-Za-z0-9._/-]', '')

// Persistent signing configuration sourced from CI Secrets / Gradle properties (never hardcoded in source)
def persistentKeystorePath = (project.findProperty('androidKeystoreFile') ?: System.getenv('ANDROID_KEYSTORE_FILE') ?: '').toString().trim()
def persistentKeystoreFile = persistentKeystorePath ? file(persistentKeystorePath) : null
def persistentStorePassword = (project.findProperty('androidKeystorePassword') ?: System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: '').toString()
def persistentKeyAlias = (project.findProperty('androidKeyAlias') ?: System.getenv('ANDROID_KEY_ALIAS') ?: '').toString()
def persistentKeyPassword = (project.findProperty('androidKeyPassword') ?: System.getenv('ANDROID_KEY_PASSWORD') ?: persistentStorePassword).toString()
def hasPersistentSigning = persistentKeystoreFile != null && persistentKeystoreFile.exists() && persistentStorePassword && persistentKeyAlias && persistentKeyPassword

def permanentDebugKeystore = file('debug.keystore')
def debugStorePass = (project.findProperty('debugKeystorePassword') ?: System.getenv('ANDROID_DEBUG_KEYSTORE_PASSWORD') ?: 'android').toString()
def debugKeyAlias = (project.findProperty('debugKeyAlias') ?: System.getenv('ANDROID_DEBUG_KEY_ALIAS') ?: 'androiddebugkey').toString()
def debugKeyPass = (project.findProperty('debugKeyPassword') ?: System.getenv('ANDROID_DEBUG_KEY_PASSWORD') ?: debugStorePass).toString()

android {
    namespace = "et.cbe.tanadigitalbank"
    compileSdk = rootProject.ext.compileSdkVersion
    signingConfigs {
        debug {
            if (hasPersistentSigning) {
                storeFile persistentKeystoreFile
                storePassword persistentStorePassword
                keyAlias persistentKeyAlias
                keyPassword persistentKeyPassword
            } else if (permanentDebugKeystore.exists()) {
                storeFile permanentDebugKeystore
                storePassword debugStorePass
                keyAlias debugKeyAlias
                keyPassword debugKeyPass
            }
        }
        release {
            if (hasPersistentSigning) {
                storeFile persistentKeystoreFile
                storePassword persistentStorePassword
                keyAlias persistentKeyAlias
                keyPassword persistentKeyPassword
            } else if (permanentDebugKeystore.exists()) {
                storeFile permanentDebugKeystore
                storePassword debugStorePass
                keyAlias debugKeyAlias
                keyPassword debugKeyPass
            }
        }
    }
    defaultConfig {
        applicationId "et.cbe.tanadigitalbank"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode ciVersionCode
        versionName ciVersionName
        buildConfigField "String", "GITHUB_UPDATE_REPO", "\"${ciGithubRepo}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    flavorDimensions += "app"
    productFlavors {
        cbe {
            dimension = "app"
            applicationId "et.cbe.tanadigitalbank"
            buildConfigField "String", "DEFAULT_START_VIEW", '""'
            buildConfigField "boolean", "IS_MESSAGES_FLAVOR", "false"
            buildConfigField "boolean", "IS_STANDALONE_SUBAPP", "false"
            buildConfigField "String", "APK_ASSET_NAME", '"CBE-Mobile-Banking-debug.apk"'
        }
        messages {
            dimension = "app"
            applicationId "et.cbe.messages"
            buildConfigField "String", "DEFAULT_START_VIEW", '"sms"'
            buildConfigField "boolean", "IS_MESSAGES_FLAVOR", "true"
            buildConfigField "boolean", "IS_STANDALONE_SUBAPP", "true"
            buildConfigField "String", "APK_ASSET_NAME", '"Messages-SMS-debug.apk"'
        }
        truecaller {
            dimension = "app"
            applicationId "et.cbe.truecaller"
            buildConfigField "String", "DEFAULT_START_VIEW", '"truecaller"'
            buildConfigField "boolean", "IS_MESSAGES_FLAVOR", "false"
            buildConfigField "boolean", "IS_STANDALONE_SUBAPP", "true"
            buildConfigField "String", "APK_ASSET_NAME", '"Truecaller-debug.apk"'
        }
        phone {
            dimension = "app"
            applicationId "et.cbe.phone"
            buildConfigField "String", "DEFAULT_START_VIEW", '"phone"'
            buildConfigField "boolean", "IS_MESSAGES_FLAVOR", "false"
            buildConfigField "boolean", "IS_STANDALONE_SUBAPP", "true"
            buildConfigField "String", "APK_ASSET_NAME", '"Phone-debug.apk"'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
