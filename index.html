<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA & Mobile Fullscreen Metadata -->
    <title>CBE Mobile Banking - Commercial Bank of Ethiopia</title>
    <meta name="description" content="Official Commercial Bank of Ethiopia (CBE) Mobile Banking application featuring instant transfers, bill payments, and secure digital finance." />
    
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CBE Mobile Banking" />
    <meta name="application-name" content="CBE Mobile Banking" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Brand Colors -->
    <meta name="theme-color" content="#70189F" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#70189F" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#70189F" />

    <!-- PWA Manifest & Icons -->
    <link id="pwa-manifest-link" rel="manifest" href="/manifest.webmanifest" />
    <link id="app-favicon-png" rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link id="app-favicon-svg" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link id="app-apple-touch-icon" rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link id="app-mask-icon" rel="mask-icon" href="/icons/icon-maskable.svg" color="#deb356" />

    <!-- Early PWA Install Prompt Capture -->
    <script>
      window.__deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa_prompt_ready'));
        console.log('[PWA] Early beforeinstallprompt captured and saved');
      });
    </script>

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&family=Nunito:wght@600;700;800;900&family=Oswald:wght@500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  </head>
  <body class="bg-slate-950 font-sans overflow-x-hidden select-none touch-manipulation">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

  </body>
</html>
