<!doctype html>
<html lang="en" class="h-full w-full bg-white">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA & Mobile Fullscreen Metadata -->
    <title>CBE Mobile Banking</title>
    <meta name="description" content="Official Commercial Bank of Ethiopia (CBE) Mobile Banking application featuring instant transfers, bill payments, and secure digital finance." />
    <meta property="og:title" content="CBE Mobile Banking" />
    <meta property="og:description" content="Official Commercial Bank of Ethiopia (CBE) Mobile Banking application featuring instant transfers, bill payments, and secure digital finance." />
    
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CBE Mobile Banking" />
    <meta name="application-name" content="CBE Mobile Banking" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Device Phone Status Bar & Navigation Bar Theme: White edge-to-edge on opening, with light status bar -->
    <meta name="theme-color" content="#ffffff" id="meta-theme-color" />
    <meta name="msapplication-navbutton-color" content="#ffffff" />
    <meta name="navigation-bar-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />

    <!-- PWA Manifest & Icons -->
    <link id="pwa-manifest-link" rel="manifest" href="/manifest.webmanifest" />
    <link id="app-favicon-png" rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link id="app-favicon-svg" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link id="app-apple-touch-icon" rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link id="app-mask-icon" rel="mask-icon" href="/icons/icon-maskable.svg" color="#deb356" />

    <!-- Early Sub-App Boot Isolation + PWA Install Prompt Capture & HMR Error Suppression -->
    <script>
      // Synchronously detect standalone sub-apps BEFORE first paint so CBE splash/white screen never flashes
      (function() {
        try {
          var ua = navigator.userAgent || '';
          var standaloneMatch = ua.match(/CBE_STANDALONE_FLAVOR\/(sms|truecaller|phone)/i);
          var launchMatch = ua.match(/CBE_LAUNCH_VIEW\/(sms|truecaller|phone)/i);
          var path = (window.location.pathname || '').toLowerCase().replace(/\/+$/, '') || '/';
          var firstSeg = path.replace(/^\/+/, '').split('/')[0] || '';
          var params = new URLSearchParams(window.location.search || '');
          var appParam = (params.get('app') || params.get('view') || '').toLowerCase();
          var hash = (window.location.hash || '').toLowerCase();

          var pathSubApp = null;
          if (firstSeg === 'sms' || appParam === 'sms' || hash === '#sms' || hash.indexOf('#/sms') === 0) pathSubApp = 'sms';
          else if (firstSeg === 'truecaller' || appParam === 'truecaller' || hash === '#truecaller' || hash.indexOf('#/truecaller') === 0) pathSubApp = 'truecaller';
          else if (firstSeg === 'phone' || appParam === 'phone' || hash === '#phone' || hash.indexOf('#/phone') === 0) pathSubApp = 'phone';

          var presetLocked = window.__CBE_LOCKED_SUBAPP__;
          var lockedSubApp =
            (presetLocked === 'sms' || presetLocked === 'truecaller' || presetLocked === 'phone')
              ? presetLocked
              : (standaloneMatch ? standaloneMatch[1].toLowerCase() : pathSubApp);
          var initialSubApp = lockedSubApp || (launchMatch ? launchMatch[1].toLowerCase() : null);

          if (lockedSubApp) {
            window.__CBE_LOCKED_SUBAPP__ = lockedSubApp;
          }
          if (initialSubApp) {
            window.__CBE_INITIAL_SUBAPP__ = initialSubApp;
            var metaMap = {
              sms: { bg: '#000000', title: 'Messages' },
              truecaller: { bg: '#0b1220', title: 'Truecaller' },
              phone: { bg: '#000000', title: 'Phone' }
            };
            var m = metaMap[initialSubApp];
            if (m) {
              document.title = m.title;
              document.documentElement.classList.remove('bg-white');
              document.documentElement.style.backgroundColor = m.bg;
              var tc = document.getElementById('meta-theme-color');
              if (tc) tc.setAttribute('content', m.bg);
              var st = document.createElement('style');
              st.id = 'subapp-boot-bg';
              st.textContent = 'html,body,#root{background-color:' + m.bg + ' !important;}';
              document.head.appendChild(st);
            }
          }
        } catch (e) {}
      })();

      // Suppress Vite HMR WebSocket errors in sandboxed iframe environment
      window.addEventListener('error', function(e) {
        var msg = (e.message || '') + ' ' + ((e.error && e.error.message) || '') + ' ' + ((e.error && e.error.stack) || '');
        if (msg.includes("reading 'send'") || msg.includes('WebSocket') || msg.includes('vite') || msg.includes('HMR')) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var msg = (e.reason ? (e.reason.message || e.reason.stack || String(e.reason)) : '');
        if (msg.includes("reading 'send'") || msg.includes('WebSocket') || msg.includes('vite') || msg.includes('HMR')) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);

      window.__deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa_prompt_ready'));
        console.log('[PWA] Early beforeinstallprompt captured and saved');
      });
    </script>

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@400;500;600;700&family=Noto+Serif+Ethiopic:wght@500;600;700&family=Nunito:wght@600;700;800;900&family=Oswald:wght@500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  </head>
  <body class="bg-white font-sans overflow-x-hidden select-none touch-manipulation h-full w-full">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

  </body>
</html>
