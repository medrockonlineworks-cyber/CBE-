<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA & Mobile Fullscreen Metadata -->
    <title>Tana Digital Bank - Mobile Banking</title>
    <meta name="description" content="Commercial Bank of Ethiopia & Tana Digital Mobile Banking application with instant transfers, bill payments, and secure account management." />
    
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tana Bank" />
    <meta name="application-name" content="Tana Digital Bank" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Brand Colors -->
    <meta name="theme-color" content="#300642" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a0126" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#300642" />

    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
    <link rel="mask-icon" href="/icons/icon-maskable.svg" color="#deb356" />

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950 font-sans overflow-x-hidden select-none touch-manipulation">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Safe Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('[PWA] ServiceWorker registered with scope:', registration.scope);
            })
            .catch((error) => {
              console.warn('[PWA] ServiceWorker registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
