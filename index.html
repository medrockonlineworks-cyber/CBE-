<!doctype html>
<html lang="en" class="h-full w-full bg-white">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA & Mobile Fullscreen Metadata -->
    <title>CBE Mobil</title>
    <meta name="description" content="Official Commercial Bank of Ethiopia (CBE) CBE Mobil application featuring instant transfers, bill payments, and secure digital finance." />
    <meta property="og:title" content="CBE Mobil" />
    <meta property="og:description" content="Official Commercial Bank of Ethiopia (CBE) CBE Mobil application featuring instant transfers, bill payments, and secure digital finance." />
    
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CBE Mobil" />
    <meta name="application-name" content="CBE Mobil" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Device Phone Status Bar & Navigation Bar Colors: White (#ffffff) on opening login screen -->
    <meta name="theme-color" content="#ffffff" id="meta-theme-color" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="msapplication-navbutton-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />

    <!-- PWA Manifest & Icons -->
    <link id="pwa-manifest-link" rel="manifest" href="/manifest.webmanifest" />
    <link id="app-favicon-png" rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link id="app-favicon-svg" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link id="app-apple-touch-icon" rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link id="app-mask-icon" rel="mask-icon" href="/icons/icon-maskable.svg" color="#deb356" />

    <!-- Early PWA Install Prompt Capture & HMR Error Suppression -->
    <script>
      // Suppress Vite HMR WebSocket errors in sandboxed iframe environment
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes("reading 'send'") || e.message.includes('WebSocket') || e.message.includes('vite'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && (String(e.reason).includes("reading 'send'") || String(e.reason).includes('WebSocket') || String(e.reason).includes('vite'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });

      window.__deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa_prompt_ready'));
        console.log('[PWA] Early beforeinstallprompt captured and saved');
      });
    </script>

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@400;500;600;700&family=Noto+Serif+Ethiopic:wght@500;600;700&family=Nunito:wght@600;700;800;900&family=Oswald:wght@500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  </head>
  <body class="bg-white font-sans overflow-x-hidden select-none touch-manipulation h-full w-full">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

  </body>
</html>
