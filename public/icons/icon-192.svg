<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="cbeBg" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#8c1fad" />
      <stop offset="50%" stop-color="#5E1887" />
      <stop offset="100%" stop-color="#34054d" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="30%" stop-color="#F5D061" />
      <stop offset="70%" stop-color="#deb356" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#deb356" />
      <stop offset="50%" stop-color="#854d0e" />
      <stop offset="100%" stop-color="#deb356" />
    </linearGradient>
  </defs>

  <!-- Solid App Icon Base (Safe for standard and maskable Android launcher) -->
  <rect width="512" height="512" rx="100" fill="url(#cbeBg)" />
  <rect x="12" y="12" width="488" height="488" rx="88" fill="none" stroke="url(#goldRim)" stroke-width="6" opacity="0.85" />

  <!-- Outer Ambient Gold Ring -->
  <circle cx="256" cy="230" r="160" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" opacity="0.4" stroke-dasharray="8 8" />

  <!-- Radiating Decorative CBE Crest Waves in Background -->
  <g stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.55">
    <path d="M230 90 C150 90, 70 140, 56 215 C42 290, 105 365, 205 378 C305 390, 405 340, 420 250 C435 160, 350 110, 265 110" />
    <path d="M215 70 C125 74, 50 130, 36 215 C22 300, 95 385, 200 400 C305 415, 415 360, 435 265" opacity="0.4" />
    <path d="M245 105 C170 105, 95 155, 80 225 C65 295, 125 360, 215 370 C305 380, 385 330, 400 255" opacity="0.45" />
  </g>

  <!-- Central CBE Medallion Background Disc -->
  <circle cx="256" cy="230" r="142" fill="#430b5e" stroke="url(#goldGrad)" stroke-width="8" />
  <circle cx="256" cy="230" r="130" fill="url(#cbeBg)" stroke="#deb356" stroke-width="2" opacity="0.9" />

  <!-- CBE Monogram Symbol (Official Landmark Pillar, Arch Vault & Wings) in Pure Gold -->
  <g fill="url(#goldGrad)" transform="translate(138, 112) scale(2.95)">
    <!-- Outer Arch Vault Enclosure -->
    <path d="M40 4 C20 4, 4 20, 4 40 C4 60, 20 76, 40 76 C60 76, 76 60, 76 40 C76 20, 60 4, 40 4 Z M40 11 C56 11, 69 24, 69 40 C69 56, 56 69, 40 69 C24 69, 11 56, 11 40 C11 24, 24 11, 40 11 Z" />
    <!-- Center Landmark Monument Pillar -->
    <rect x="35" y="19" width="10" height="38" rx="2.5" />
    <!-- Winged Roof Arch -->
    <path d="M22 31 Q40 18 58 31 L58 37 Q40 24 22 37 Z" />
    <!-- Inner Medallion Accent -->
    <circle cx="40" cy="28" r="4.5" fill="#430b5e" />
    <circle cx="40" cy="28" r="2.2" fill="url(#goldGrad)" />
    <!-- Base Pedestal -->
    <rect x="22" y="54" width="36" height="5.5" rx="1.5" />
  </g>

  <!-- Official High-Contrast Banner Label -->
  <rect x="76" y="408" width="360" height="54" rx="27" fill="#250338" stroke="url(#goldGrad)" stroke-width="3" />
  <text x="256" y="445" fill="url(#goldGrad)" font-size="28" font-weight="900" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" letter-spacing="5px">CBE MOBILE</text>
</svg>
